name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
        timeout-minutes: 12
      - name: Demo smoke test
        run: python -m approximately.cli demo
        timeout-minutes: 5

  test-llm:
    # Judge integration tests: real openai client vs a local fake server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install with llm extra
        run: pip install -e ".[dev,llm]"
      - name: Judge integration tests
        run: pytest tests/test_judge.py -v
      - name: Full suite (judge paths included)
        run: pytest -q

  security:
    # Supply-chain + static security gate. Actions are SHA-pinned
    # (third-party code can't drift behind a mutable tag); bandit runs
    # with zero findings expected — intentional fallbacks carry a
    # reasoned `# nosec B110`; a regex secret scan guards the repo and
    # the packaging metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . bandit
      - name: Bandit (no findings expected)
        run: bandit -r src -q
      - name: Secret scan
        run: |
          ! grep -rInE '(api[_-]?key|secret|token|password)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9+/]{16,}' src .github pyproject.toml | grep -v PYPI_API_TOKEN

  test-contrib:
    # Framework adapters against the real packages (LangChain/LangGraph and
    # OpenAI Agents SDK); CrewAI adapter is covered by graceful-skip tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install with contrib frameworks
        run: pip install -e ".[dev,llm]" langchain-core openai-agents
      - name: Adapter tests
        run: pytest tests/test_v02_v03.py -v

  bench-gate:
    # Attribution-quality regression gate: rule detectors over the
    # shipped gold corpus must clear docs/bench-floors.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Attribution floors (gold corpus, package CLI)
        run: approximately bench-gate docs/mast-bench-multi.jsonl --floors docs/bench-floors.json --label "gold corpus"
      - name: Attribution floors (synthetic fixture, shim script)
        run: python scripts/bench_gate.py --synth
      - name: Attribution performance gate
        run: python scripts/perf_gate.py

  action-self-test:
    # Dogfood the reusable attribution-gate action (action.yml) from
    # this repo: the positive fixture must pass, the impossible-floor
    # fixture must fail the step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Positive fixture clears the floors
        uses: ./
        with:
          dataset: examples/action/fixture.jsonl
          floors: examples/action/floors.json
          label: selftest
          install-from: source
      - name: Impossible floor must fail
        id: negative
        continue-on-error: true
        uses: ./
        with:
          dataset: examples/action/fixture.jsonl
          floors: examples/action/floors-impossible.json
          label: selftest-negative
          install-from: source
      - name: Assert the negative path failed
        if: steps.negative.outcome == 'success'
        run: |
          echo "::error::impossible floors did NOT fail the action"
          exit 1

  packaging:
    # Validate the PyPI path end to end without tagging: build sdist
    # + wheel, then smoke-install the wheel into a clean venv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Wheel smoke test (clean venv)
        run: |
          python -m venv smoke
          smoke/bin/pip install dist/approximately-*.whl
          smoke/bin/approximately --version
          smoke/bin/python -c "from approximately import Recorder; r = Recorder('smoke', save=False); r.tool('bash', {'cmd': 'ls'}, result='ok'); r.respond('done', success=True); assert len(r.trace.steps) == 2; print('wheel smoke OK')"
          smoke/bin/python -m approximately.cli demo --scenario loop | grep -q "CycleRepeatDetector"
          smoke/bin/python -m approximately.cli demo --scenario verification | grep -q "ProseOutcomeVerifyDetector"
          echo "demo scenarios OK"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile all sources
        run: python -m compileall -q src examples tests
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests examples
      - name: Type check
        run: |
          pip install mypy
          mypy src/approximately --ignore-missing-imports
      - name: Complexity gate (blocks D/F-grade functions)
        run: |
          pip install xenon
          xenon --max-absolute C --max-modules B --max-average A src
