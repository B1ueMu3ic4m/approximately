name: agent-audit
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: nightly audit (doctor + gate + forecast)
        run: |
          approximately audit --store .agents-store \
            --max-failure-rate 0.5 \
            --max-p95-latency-ms 15000 \
            --max-tokens 2000000 \
            --max-budget-breaches 0 \
            --min-traces 1 \
            --grade-floor F \
            --triage-top 5 \
            --fix
        # add --digest-dir + --spend-ceiling once a watch feeds digests
        # raise --grade-floor from F toward B as your agents mature
