name: agent-audit
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the package is not on PyPI yet (publishing needs the
      # owner's one-time Trusted Publishing setup) - install from
      # the repo itself, like agent-gate does
      - run: pip install .
      - name: record a demo store (two ok runs, one failure)
        run: |
          python - <<'PY'
          from approximately.recorder import Recorder
          from approximately.store import TraceStore
          store = TraceStore(".agents-store")
          for i, ok in enumerate([True, True, False]):
              rec = Recorder(f"demo run {i}", store=store)
              rec.tool("sh", {"cmd": "deploy"}, result="ok")
              rec.respond("done", success=ok)
              store.save(rec.trace)
          PY
      - name: nightly audit (doctor + gate + forecast)
        run: |
          approximately audit --store .agents-store \
            --max-failure-rate 0.5 \
            --max-p95-latency-ms 15000 \
            --max-tokens 2000000 \
            --max-budget-breaches 0 \
            --min-traces 1 \
            --grade-floor F \
            --triage-top 5 \
            --fix
        # add --digest-dir + --spend-ceiling once a watch feeds digests
        # raise --grade-floor from F toward B as your agents mature
