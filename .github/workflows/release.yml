name: Release

# Publishes when a v* tag appears — pushed manually, or automatically
# by autotag.yml whenever main's version changes.
#
# The GitHub Release (Releases page entry with auto-generated notes
# and the dist assets) is always created. The PyPI publish is
# best-effort until publish credentials exist: it uses the
# PYPI_API_TOKEN secret if set, else Trusted Publishing (which needs
# the one-time pypi.org → project → Publishing setup). An
# unconfigured PyPI marks this job with a notice — it never blocks
# the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "approximately $GITHUB_REF_NAME"
          --generate-notes

  pypi-publish:
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    # Best-effort until credentials exist; the Release stands either way.
    continue-on-error: true
    permissions:
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (API token, if configured)
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI (Trusted Publishing fallback)
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
