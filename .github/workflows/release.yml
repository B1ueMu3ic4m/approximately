name: Release

# Publishes when a v* tag appears — pushed manually, or automatically
# by autotag.yml whenever main's version changes.
#
# The GitHub Release (Releases page entry with auto-generated notes
# and the dist assets) is always created. The PyPI publish is
# best-effort until publish credentials exist: it uses the
# PYPI_API_TOKEN secret if set, else Trusted Publishing (which needs
# the one-time pypi.org → project → Publishing setup). An
# unconfigured PyPI marks this job with a notice — it never blocks
# the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes needs a repository context (it diffs against
      # the previous tag); artifact-only jobs have no .git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Releases page is where per-version detail belongs; the
          # README stays lean. Body = this tag's CHANGELOG section.
          python - "$GITHUB_REF_NAME" > release-notes.md <<'EOF'
          import re, sys
          tag = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""
          m = re.search(rf"^## {re.escape(tag)}\s*$(.*?)(?=^## v|\Z)",
                        text, re.M | re.S)
          print(m.group(1).strip() if m else f"Release {tag}.")
          EOF
          prev=$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "approximately $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  pypi-publish:
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    # Best-effort until credentials exist; the Release stands either way.
    continue-on-error: true
    permissions:
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (API token, if configured)
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI (Trusted Publishing fallback)
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
