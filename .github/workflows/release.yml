name: Release

# Publishes to PyPI when a v* tag is pushed.
#
# One-time setup (repo owner): configure Trusted Publishing on PyPI —
# pypi.org → your project → Publishing → GitHub publisher, with this
# workflow name ("release.yml") and environment "pypi". No API token
# needed. Then: git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
