[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "approximately"
version = "0.3.0"
description = "Approximate memory, exact accountability: a context runtime (budgeted windows, pins, recall probes) plus a flight recorder (MAST failure attribution, replay, regression tests) for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Approximately contributors" }]
keywords = ["llm", "agents", "context-engineering", "debugging", "observability", "failure-analysis", "mast", "replay", "testing", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
exact-tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7.0", "mypy"]

[project.scripts]
approximately = "approximately.cli:main"

[project.urls]
Homepage = "https://github.com/B1ueMu3ic4m/approximately"
Documentation = "https://github.com/B1ueMu3ic4m/approximately/tree/main/docs"
Issues = "https://github.com/B1ueMu3ic4m/approximately/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/approximately"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
# pragmatic set: errors, pyflakes, warnings, bugbear, imports, misc
select = ["E", "F", "W", "B", "I", "ISC", "RUF", "SIM", "PERF", "PLW", "C4"]
ignore = [
    "BLE001",  # blind except is intentional: attribution must never hard-fail
    "PLW0603", # module-level caches (_INTENT_RE etc.) are deliberate
    "E501",    # help strings read better unwrapped
    "SIM105",  # try/except-pass around optional imports is the designed pattern
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW1510", "S101", "E402"]
"src/approximately/store.py" = ["PERF203"]  # per-file try in loop is the degradation pattern
"src/approximately/cli.py" = ["PERF203"]
